<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHL Manager — Карьера тренера</title>
<style>
:root{--bg:#080d19;--panel:#111a2c;--panel2:#17233a;--line:#263653;--text:#eef4ff;--muted:#91a4c3;--gold:#f3c95d;--blue:#4e8dff;--green:#50d6a0;--red:#ff7272}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#152544 0,#080d19 55%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:var(--gold);color:#101522;font-weight:800;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#263653;color:var(--text)}button.danger{background:#7d303d;color:white}button:disabled{opacity:.4;cursor:not-allowed;transform:none}
header{position:sticky;top:0;z-index:5;background:#080d19ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.04em}.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ffedb2);display:grid;place-items:center;color:#111827;font-size:22px}
.header-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:#c9d7ee;font-size:12px}
.wrap{max-width:1240px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(115deg,#1a2e50,#111a2c 60%,#292644);border:1px solid #354767;border-radius:22px;padding:24px;position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:"";position:absolute;width:260px;height:260px;border:36px solid #ffffff09;border-radius:50%;right:-50px;top:-100px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.14em;font-size:11px;text-transform:uppercase}.hero h1{font-size:clamp(25px,4vw,42px);line-height:1.05;margin:8px 0}.hero p{color:#b9c9e4;max-width:650px;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#080d194c;border:1px solid #ffffff18;border-radius:13px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:21px}
.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 14px;scrollbar-width:thin}.tab{background:var(--panel);border:1px solid var(--line);color:#b8c8e3;white-space:nowrap}.tab.active{background:var(--gold);color:#111827;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}.panel h2,.panel h3{margin:0 0 12px}.panel h2{font-size:19px}.panel h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.club-logo{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-weight:1000;font-size:20px;color:white;flex-shrink:0;border:1px solid #ffffff44;box-shadow:inset 0 0 0 3px #00000018}.club-title{display:flex;gap:13px;align-items:center}.club-title h2{margin:0}.card-list{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b1322;border:1px solid #263653;border-radius:12px;padding:11px}.item-left{min-width:0}.item-title{font-weight:800}.item-sub{font-size:12px;color:var(--muted)}.badge{font-size:11px;border-radius:6px;padding:4px 7px;background:#263653;color:#d8e4fa;white-space:nowrap}.badge.good{background:#174a40;color:#7cf0c0}.badge.warn{background:#533e20;color:#ffda85}.badge.bad{background:#552b36;color:#ffb4ba}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #263653;white-space:nowrap}th{background:#18243a;color:#a9bbd9;font-size:11px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}tr.mine td{background:#263550}.num{text-align:right;font-variant-numeric:tabular-nums}.notice{padding:11px 13px;border-radius:11px;background:#1c2d48;border:1px solid #314969;color:#c8d8f2}.notice.gold{background:#332c1c;border-color:#5b4a2b;color:#ffe3a0}.notice.red{background:#3b202b;border-color:#69303c;color:#ffc3c8}
select,input{background:#0b1322;border:1px solid #344866;border-radius:9px;color:var(--text);padding:9px;max-width:100%}label{display:grid;gap:5px;color:#a9bbd9;font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.player{background:#0b1322;border:1px solid #2b3c5a;border-radius:12px;padding:12px}.player strong{display:block}.player .rating{font-size:22px;font-weight:950;color:var(--gold)}.slot{min-height:58px;background:#0a1220;border:1px dashed #3c5070;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:center}.slot select{width:100%;font-size:12px}.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.line-block{background:#111c30;border:1px solid var(--line);padding:10px;border-radius:12px}.line-block h3{font-size:12px;color:var(--gold);margin:0 0 8px}.line-slots{display:grid;gap:6px}.line-slots .slot{min-height:54px}.goalies{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goalies .slot{min-height:80px}.empty{padding:36px 12px;text-align:center;color:var(--muted)}.event{border-left:3px solid var(--gold);padding:4px 0 4px 12px}.event+.event{margin-top:12px}.footer-note{margin-top:14px;color:#7488a9;font-size:11px}.modal-back{position:fixed;inset:0;background:#000a;z-index:10;display:grid;place-items:center;padding:16px}.modal{background:var(--panel);border:1px solid #405579;border-radius:18px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.club-choice{display:flex;gap:10px;align-items:center;text-align:left;background:#0b1322;color:var(--text);border:1px solid var(--line);padding:12px}.club-choice:hover{border-color:var(--gold)}.club-choice .club-logo{width:43px;height:43px;font-size:15px}.club-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;background:#f3c95d;color:#101522;padding:11px 17px;border-radius:999px;font-weight:800;box-shadow:0 8px 30px #0008}
@media(max-width:760px){header{align-items:flex-start;padding:10px 13px}.header-meta .pill:nth-child(2){display:none}.wrap{padding:14px 11px 40px}.hero{padding:19px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.player-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.lines{grid-template-columns:1fr}.club-choices{grid-template-columns:1fr}.panel{padding:13px}.brand small{display:none}}
</style>
</head>
<body>
<header><div class="brand"><div class="brand-mark">🏒</div><div>KHL <span style="color:var(--gold)">MANAGER</span><small style="display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.12em">КАРЬЕРА ГЛАВНОГО ТРЕНЕРА</small></div></div><div class="header-meta"><span class="pill" id="seasonPill">Сезон 2026/27</span><span class="pill" id="datePill">Август · неделя 1</span><button class="secondary" id="saveBtn">Сохранить</button></div></header>
<main class="wrap" id="app"></main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('ru-RU').format(Math.round(n));
const money = n => (n/1000000).toFixed(1).replace('.',',')+' млн ₽';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const clubSeed = [
['СКА','Запад','#c52b3a',1250],['ЦСКА','Запад','#b92735',1450],['Динамо Москва','Запад','#1668ad',1100],['Спартак','Запад','#d92835',900],['Локомотив','Запад','#e5b82e',1200],['Торпедо','Запад','#2a8b62',780],['Северсталь','Запад','#e7bd2f',720],['Динамо Минск','Запад','#2079be',850],['Шанхай Дрэгонс','Запад','#d43b34',820],['Витязь','Запад','#b62b3b',620],['Сочи','Запад','#d8b43b',580],
['Металлург Мг','Восток','#d5a52c',1150],['Ак Барс','Восток','#087d51',1200],['Авангард','Восток','#c92e3b',1100],['Трактор','Восток','#22252d',980],['Салават Юлаев','Восток','#188b55',950],['Автомобилист','Восток','#c92e3b',900],['Нефтехимик','Восток','#198c67',680],['Трактор-2','Восток','#9b9b9b',500],['Барыс','Восток','#1b68a9',720],['Амур','Восток','#d6a32a',650],['Адмирал','Восток','#168c9b',650]
];
// Keep the 22 slots unique while representing a plausible league. One fictional club is clearly marked.
clubSeed[18]=['Сибирь','Восток','#2d78bd',730];
clubSeed[19]=['Барыс','Восток','#1b68a9',720];
clubSeed[20]=['Амур','Восток','#d6a32a',650];
clubSeed[21]=['Адмирал','Восток','#168c9b',650];
const first=['Александр','Дмитрий','Никита','Илья','Максим','Артём','Егор','Кирилл','Матвей','Даниил','Михаил','Тимур','Роман','Владислав','Сергей','Ярослав','Павел','Денис','Антон','Глеб','Лев','Константин','Иван','Фёдор','Степан','Марк','Борис','Андрей','Виталий','Руслан'];
const last=['Соколов','Кузнецов','Попов','Васильев','Петров','Смирнов','Морозов','Волков','Новиков','Фёдоров','Орлов','Зайцев','Павлов','Семёнов','Голубев','Виноградов','Белов','Комаров','Киселёв','Макаров','Андреев','Тихонов','Громов','Лебедев','Ковалёв','Баранов','Крылов','Сафонов','Быков','Тарасов','Козлов','Ершов'];
const countries=['Россия','Россия','Россия','Россия','Россия','Беларусь','Казахстан','Россия','Россия','Россия','Канада','США','Россия','Россия','Беларусь','Россия'];
const posList=['Ц','ЛК','ПК','ЛЗ','ПЗ','ВР'];
const posName={Ц:'Центр',ЛК:'Левый крайний',ПК:'Правый крайний',ЛЗ:'Левый защитник',ПЗ:'Правый защитник',ВР:'Вратарь'};
const staffNames=['Второй тренер','Тренер по физподготовке','Врач','Тренер вратарей'];
const defaultStaff=['Алексей Белов','Игорь Миронов','Сергей Котов','Павел Лисин'];
const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const uid=()=>Math.random().toString(36).slice(2,10);
let state=null, currentTab='Главная', tradeOffer=null, selectedTraining=[];
function makePlayer(teamId,index,prospect=false){
 let age=prospect?rng(16,20):rng(19,37), pos=posList[index%6];
 if(index%6===5) pos='ВР'; else pos=['Ц','ЛК','ПК','ЛЗ','ПЗ'][index%5];
 let peak=pos==='ВР'?71:70, rating=clamp(Math.round(peak+(age<23?(age-20)*1.5:age>30?(30-age)*1.5:0)+rng(-12,12)+(index<5?7:0)),38,94);
 return {id:uid(),name:first[rng(0,first.length-1)]+' '+last[rng(0,last.length-1)],pos,age,rating,country:countries[rng(0,countries.length-1)],salary:Math.round((rating*rating*1800+age*10000)/10000)*10000,years:rng(1,3),teamId,system:prospect,injury:0,retiring:false};
}
function makeTeam(seed,id){
 let players=[]; for(let i=0;i<28;i++)players.push(makePlayer(id,i));
 let staff=defaultStaff.map((name,i)=>({name,rating:rng(55,83),cost:rng(20,75)*1000000,role:staffNames[i]}));
 return {id,name:seed[0],conf:seed[1],color:seed[2],budget:seed[3]*1000000,cash:seed[3]*1000000,players,staff,record:{w:0,ot:0,l:0,gf:0,ga:0,pts:0},schedule:[],offers:[],coachRating:rng(62,83)};
}
function generateGame(){
 const teams=clubSeed.map((s,i)=>makeTeam(s,i));
 const games=[], pairCounts={};
 // 68 games per team: 34 home/34 away generated from round-robin pairs, repeated pairings
 for(let i=0;i<22;i++)for(let j=i+1;j<22;j++){games.push({home:i,away:j});games.push({home:j,away:i});}
 // 462 games, reduce to 748? use round-robin home/away 42 per team plus 26 repeat games
 for(let i=0;i<22;i++)for(let j=i+1;j<22;j++){games.push({home:i,away:j});games.push({home:j,away:i});}
 // 924 games = 84 per team; trim to 68 via per-team cap while preserving balanced matchups
 let counts=Array(22).fill(0), schedule=[];
 const shuffled=games.sort(()=>Math.random()-.5);
 for(const g of shuffled){if(counts[g.home]<68&&counts[g.away]<68){schedule.push({...g,played:false,day:0,id:uid()});counts[g.home]++;counts[g.away]++;}}
 // Fill any rare deficits with random opponent
 while(counts.some(c=>c<68)){let a=counts.indexOf(Math.min(...counts)), b=rng(0,21);if(a===b||counts[b]>=68)continue;schedule.push({home:rng(0,1)?a:b,away:rng(0,1)?b:a,played:false,day:0,id:uid()});counts[a]++;counts[b]++;}
 schedule.sort(()=>Math.random()-.5); schedule.forEach((g,i)=>g.day=i+1);
 teams.forEach(t=>t.schedule=schedule.filter(g=>g.home===t.id||g.away===t.id).sort((a,b)=>a.day-b.day));
 return {version:1,season:2026,week:1,phase:'preseason',day:0,teams,userTeam:null,schedule,news:[],trainingUsed:false,seasonEnded:false,playoffs:[],playoffRound:0,allStarDone:false,cupDone:false,history:[],lastResult:null};
}
function activeTeam(){return state.teams[state.userTeam]}
function getPlayer(id){for(const t of state.teams){let p=t.players.find(x=>x.id===id);if(p)return p;}return null}
function teamOfPlayer(id){return state.teams.find(t=>t.players.some(p=>p.id===id))}
function addNews(text,type='info'){state.news.unshift({id:uid(),text,type,week:state.week,season:state.season});state.news=state.news.slice(0,100)}
function dateLabel(){if(state.phase==='preseason')return 'Август · неделя '+state.week;if(state.phase==='regular')return 'Сезон · тур '+state.day;if(state.phase==='playoffs')return 'Плей-офф · раунд '+state.playoffRound;return 'Межсезонье · неделя '+state.week}
function standings(conf){return state.teams.filter(t=>t.conf===conf).sort((a,b)=>b.record.pts-a.record.pts||((b.record.gf-b.record.ga)-(a.record.gf-a.record.ga)))}
function nextGame(){return activeTeam().schedule.find(g=>!g.played)}
function opponent(g){return state.teams[g.home===state.userTeam?g.away:g.home]}
function logo(t){return `<div class="club-logo" style="background:${t.color}">${t.name.split(/[\s-]/).map(s=>s[0]).join('').slice(0,3)}</div>`}
function save(){try{localStorage.setItem('khlManagerSaveV1',JSON.stringify(state));toast('Карьера сохранена');}catch(e){toast('Не удалось сохранить в браузере')}}
function load(){try{const raw=localStorage.getItem('khlManagerSaveV1');if(raw){const s=JSON.parse(raw);if(s.version===1&&s.teams?.length===22){state=s;return true;}}}catch(e){}return false}
function toast(msg){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML='',2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showClubSelect(){
 const root=$('#modalRoot');
 root.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">НОВАЯ КАРЬЕРА</div><h1 style="margin:6px 0 8px">Выбери свой клуб</h1><p class="muted">22 команды · 2 конференции · путь к Кубку Гагарина.</p><div class="club-choices">${state.teams.map(t=>`<button class="club-choice" data-club="${t.id}">${logo(t)}<span><strong>${t.name}</strong><small style="display:block;color:var(--muted)">${t.conf} · бюджет ${money(t.budget)}</small></span></button>`).join('')}</div><p class="footer-note">Названия клубов реальные или приближённые; составы и бюджеты в этой версии игровые и условные.</p><div style="margin-top:12px"><button class="secondary" id="continueSave" ${localStorage.getItem('khlManagerSaveV1')?'':'disabled'}>Продолжить сохранённую карьеру</button></div></div></div>`;
 root.querySelectorAll('[data-club]').forEach(b=>b.onclick=()=>{state.userTeam=+b.dataset.club;state.teams.forEach(t=>{t.players.forEach(p=>p.teamId=t.id);});const my=activeTeam();my.coachRating=78;addNews('Ты назначен главным тренером клуба «'+my.name+'». Совет директоров ждёт результата.');root.innerHTML='';saveSilent();render();});
 $('#continueSave').onclick=()=>{if(load()){root.innerHTML='';render();}};
}
function saveSilent(){try{localStorage.setItem('khlManagerSaveV1',JSON.stringify(state));}catch(e){}}
function startNew(){state=generateGame();showClubSelect();}
function headerHero(){
 const t=activeTeam(),g=nextGame(),opp=g?opponent(g):null;
 let headline=state.phase==='preseason'?'Подготовка к сезону':state.phase==='regular'?'Регулярный чемпионат':state.phase==='playoffs'?'Плей-офф Кубка Гагарина':'Межсезонье';
 let next=g?`${g.home===t.id?'ДОМА':'В ГОСТЯХ'} · ${opp.name}`:'Матчей не осталось';
 return `<section class="hero"><div class="row" style="align-items:flex-start"><div><div class="eyebrow">${headline} · ${state.season}/${String(state.season+1).slice(-2)}</div><h1>${esc(t.name)}</h1><p>Твоя команда. Твои решения. Одна цель — Кубок Гагарина. Управляй составом, развивай игроков и строй чемпионскую систему.</p><div class="actions"><button id="simulateBtn">${state.phase==='preseason'?'Начать сезон':state.phase==='regular'?'Симулировать до следующего матча':state.phase==='playoffs'?'Симулировать следующий матч плей-офф':'Следующая неделя'} →</button><button class="secondary" id="quickLineup">Состав команды</button></div></div><div style="text-align:right;min-width:130px">${logo(t)}<div class="muted small" style="margin-top:8px">${t.conf} конференция</div></div></div><div class="stats"><div class="stat"><small>МЕСТО В КОНФЕРЕНЦИИ</small><strong>${standings(t.conf).findIndex(x=>x.id===t.id)+1}<span style="font-size:12px;color:var(--muted)"> / 11</span></strong></div><div class="stat"><small>ОЧКИ</small><strong>${t.record.pts}</strong></div><div class="stat"><small>БЮДЖЕТ</small><strong>${money(t.cash)}</strong></div><div class="stat"><small>СЛЕДУЮЩИЙ МАТЧ</small><strong style="font-size:14px">${esc(next)}</strong></div></div></section>`;
}
const tabs=['Главная','Новости','Обмены','Состав','Тренировки','Тренерский штаб','Система','Лига'];
function render(){
 if(!state||state.userTeam===null){showClubSelect();return;}
 $('#seasonPill').textContent=`Сезон ${state.season}/${String(state.season+1).slice(-2)}`;$('#datePill').textContent=dateLabel();
 const app=$('#app');app.innerHTML=headerHero()+`<nav class="tabs">${tabs.map(x=>`<button class="tab ${currentTab===x?'active':''}" data-tab="${x}">${x}</button>`).join('')}</nav><section id="content"></section><div class="footer-note">KHL MANAGER · Офлайн-симулятор · Сохранение хранится в этом браузере. Составы, рейтинги и бюджеты — игровые данные.</div>`;
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render();});
 $('#simulateBtn').onclick=simulateAction;$('#quickLineup').onclick=()=>{currentTab='Состав';render()};
 const content=$('#content');
 ({'Главная':homePage,'Новости':newsPage,'Обмены':tradesPage,'Состав':rosterPage,'Тренировки':trainingPage,'Тренерский штаб':staffPage,'Система':systemPage,'Лига':leaguePage}[currentTab]||homePage)(content);
}
function homePage(el){
 const t=activeTeam(),g=nextGame(),recent=state.news.slice(0,4);
 el.innerHTML=`<div class="grid"><div class="stack"><div class="panel"><h2>Следующий матч</h2>${g?`<div class="row"><div class="club-title">${logo(state.teams[g.home])}<div><div class="item-title">${state.teams[g.home].name}</div><div class="item-sub">Хозяева</div></div></div><strong style="font-size:20px;color:var(--gold)">VS</strong><div class="club-title">${logo(state.teams[g.away])}<div><div class="item-title">${state.teams[g.away].name}</div><div class="item-sub">Гости</div></div></div></div><div class="notice" style="margin-top:14px">Матч №${g.day} · ${g.home===t.id?'Домашняя игра':'Выездная игра'} · готовность состава влияет на результат.</div><button style="margin-top:12px;width:100%" id="homeSim">Симулировать до следующего матча</button>`:`<div class="notice gold">Регулярный чемпионат завершён.</div><button style="margin-top:12px" id="homeSim">Продолжить сезон</button>`}</div><div class="panel"><h2>Быстрые переходы</h2><div class="card-list">${[['Состав','Проверь пятёрки и вратарей'],['Обмены','Усиль команду перед дедлайном'],['Тренировки','Развивай трёх игроков в неделю'],['Лига','Следи за таблицей и результатами']].map(([a,b])=>`<div class="item"><div><div class="item-title">${a}</div><div class="item-sub">${b}</div></div><button class="secondary" data-go="${a}">Открыть</button></div>`).join('')}</div></div></div><div class="stack"><div class="panel"><h2>Команда в цифрах</h2><div class="card-list">${[['Состав',t.players.filter(p=>!p.system).length+' игроков'],['Средний рейтинг',Math.round(avg(t.players.filter(p=>!p.system).map(p=>p.rating)))],['Травмированы',t.players.filter(p=>p.injury>0).length],['Легионеры',foreignCount(t)+' / '+(t.name==='Шанхай Дрэгонс'||t.name==='Динамо Минск'||t.name==='Барыс'?'без лимита':'5')],['Тренерский рейтинг',t.coachRating]].map(([a,b])=>`<div class="item"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div></div><div class="panel"><h2>Последние новости</h2>${recent.length?recent.map(n=>`<div class="event"><div>${esc(n.text)}</div><div class="muted small">Неделя ${n.week} · ${n.type==='good'?'Позитивно':n.type==='bad'?'Тревожная новость':'Лига'}</div></div>`).join(''):'<div class="empty">Новости появятся по ходу карьеры.</div>'}<button class="secondary" style="margin-top:12px" id="allNews">Все новости</button></div></div></div>`;
 $('#homeSim').onclick=simulateAction;$('#allNews').onclick=()=>{currentTab='Новости';render()};el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.go;render()});
}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}
function foreignCount(t){return t.players.filter(p=>!p.system&&p.country!=='Россия').length}
function newsPage(el){el.innerHTML=`<div class="panel"><div class="row"><h2>Лента новостей</h2><span class="badge">${state.news.length} событий</span></div>${state.news.length?state.news.map(n=>`<div class="item" style="align-items:flex-start;margin-top:8px"><div><div class="item-title">${esc(n.text)}</div><div class="item-sub">Сезон ${n.season}/${n.season+1} · неделя ${n.week}</div></div><span class="badge ${n.type==='good'?'good':n.type==='bad'?'bad':''}">${n.type==='good'?'Успех':n.type==='bad'?'Важно':'Лига'}</span></div>`).join(''):'<div class="empty">Пока новостей нет. Начни сезон или симулируй неделю.</div>'}</div>`}
function tradesPage(el){
 const t=activeTeam(),available=state.teams.filter(x=>x.id!==t.id);
 const roster=t.players.filter(p=>!p.system);
 const myOffers=state.news.filter(n=>n.text.includes('предложение об обмене')||n.text.includes('Обмен завершён')).slice(0,6);
 el.innerHTML=`<div class="grid"><div class="panel"><h2>Предложить обмен</h2><p class="muted">Обменивай игроков на игроков, продавай хоккеистов за деньги или покупай их за компенсацию. Клуб оценивает возраст, рейтинг, зарплату и глубину состава.</p><div class="form-grid"><label>Твой игрок<select id="tradeOut"><option value="cash">Деньги вместо игрока</option>${roster.map(p=>`<option value="${p.id}">${p.name} · ${p.pos} · ${p.rating}</option>`).join('')}</select></label><label>Клуб<select id="tradeClub">${available.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><label>Игрок другого клуба<select id="tradeIn"></select></label><label>Денежная компенсация, млн ₽<input id="tradeCash" type="number" min="0" max="500" value="0"></label><label>Направление денег<select id="cashDirection"><option value="pay">Ты платишь клубу</option><option value="receive">Ты получаешь от клуба</option></select></label></div><div class="actions" style="margin-top:14px"><button id="sendTrade">Отправить предложение</button><button class="secondary" id="autoOffer">Проверить входящие</button></div><div class="notice" style="margin-top:14px">Важно: предложение не гарантирует согласие. Если обмен невыгоден другой команде, она откажет.</div></div><div class="panel"><h2>Рынок и правила</h2><div class="card-list"><div class="item"><div><strong>Дедлайн обменов</strong><div class="item-sub">До конца регулярного сезона</div></div><span class="badge">${state.phase==='regular'?'Открыт':'Условно открыт'}</span></div><div class="item"><div><strong>Доступный бюджет</strong><div class="item-sub">Деньги твоего клуба</div></div><strong>${money(t.cash)}</strong></div><div class="item"><div><strong>Легионеры</strong><div class="item-sub">Лимит считается после обмена</div></div><strong>${foreignCount(t)}/5</strong></div></div><h3 style="margin-top:18px">Последние предложения</h3>${myOffers.length?myOffers.map(n=>`<div class="event">${esc(n.text)}</div>`).join(''):'<div class="empty">Пока предложений нет.</div>'}</div></div>`;
 const fillPlayers=()=>{const club=state.teams[+$('#tradeClub').value];$('#tradeIn').innerHTML='<option value="none">Без игрока (только деньги)</option>'+club.players.filter(p=>!p.system).map(p=>`<option value="${p.id}">${p.name} · ${p.pos} · ${p.rating} · ${p.country}</option>`).join('')};
 $('#tradeClub').onchange=fillPlayers;fillPlayers();
 $('#sendTrade').onclick=sendTrade;$('#autoOffer').onclick=()=>{receiveOffer();render()};
}
function sendTrade(){
 const t=activeTeam(),outId=$('#tradeOut').value,other=state.teams[+$ ('#tradeClub').value],inId=$('#tradeIn').value,amount=Math.max(0,Number($('#tradeCash').value)||0)*1000000,dir=$('#cashDirection').value;
 const out=outId==='cash'?null:getPlayer(outId),inc=inId==='none'?null:getPlayer(inId);
 if(out&&teamOfPlayer(out.id).id!==t.id){toast('Игрок больше не в твоей команде');return}
 if(inc&&teamOfPlayer(inc.id).id!==other.id){toast('Игрок больше не в выбранном клубе');return}
 const outgoingValue=(out?playerValue(out):0)+(dir==='pay'?amount:0),incomingValue=(inc?playerValue(inc):0)+(dir==='receive'?amount:0);
 if(amount>t.cash&&dir==='pay'){toast('Недостаточно денег');return}
 if(!out&&!inc&&amount===0){toast('Укажи игрока или компенсацию');return}
 const myForeign=foreignCount(t)-(out&&out.country!=='Россия'?1:0)+(inc&&inc.country!=='Россия'?1:0);
 if(!unlimited(t)&&myForeign>5){toast('После обмена будет превышен лимит легионеров');return}
 if(!unlimited(other)&&foreignCount(other)-(inc&&inc.country!=='Россия'?1:0)+(out&&out.country!=='Россия'?1:0)>5){toast('У другого клуба будет превышен лимит легионеров');return}
 const fairness=incomingValue-Math.max(1,outgoingValue);
 const accept=fairness>=-Math.max(15e6,outgoingValue*.27)&&Math.random()<(fairness>20e6?.92:fairness>-20e6?.72:.18);
 if(!accept){addNews(other.name+' отклонил предложение об обмене. Руководство считает компенсацию недостаточной.','bad');toast('Клуб отклонил предложение');saveSilent();render();return}
 if(out){t.players=t.players.filter(p=>p.id!==out.id);out.teamId=other.id;other.players.push(out)}
 if(inc){other.players=other.players.filter(p=>p.id!==inc.id);inc.teamId=t.id;t.players.push(inc)}
 if(dir==='pay'){t.cash-=amount;other.cash+=amount}else{t.cash+=amount;other.cash-=amount}
 addNews('Обмен завершён: '+t.name+' и '+other.name+' согласовали сделку.','good');toast('Обмен состоялся!');saveSilent();render();
}
function playerValue(p){return Math.round((p.rating*p.rating*65000)*(p.age<24?1.35:p.age>32?.55:1)+(p.age<22?12e6:0))}
function unlimited(t){return ['Шанхай Дрэгонс','Динамо Минск','Барыс'].includes(t.name)}
function receiveOffer(){
 const t=activeTeam(),others=state.teams.filter(x=>x.id!==t.id),other=others[rng(0,others.length-1)],player=other.players.filter(p=>!p.system).sort((a,b)=>b.rating-a.rating)[rng(0,Math.min(8,other.players.length-1))],target=t.players.filter(p=>!p.system).sort((a,b)=>a.rating-b.rating)[rng(0,Math.min(8,t.players.length-1))];
 const cash=Math.round(rng(5,40)*1e6);
 const root=$('#modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">ВХОДЯЩЕЕ ПРЕДЛОЖЕНИЕ</div><h2>${other.name} предлагает обмен</h2><p class="muted">Клуб готов отдать игрока и хочет получить хоккеиста из твоего состава.</p><div class="grid"><div class="item"><div><strong>${player.name}</strong><div class="item-sub">${posName[player.pos]} · ${player.age} лет · рейтинг ${player.rating}</div></div><span class="badge good">${money(playerValue(player))}</span></div><div class="item"><div><strong>${target.name}</strong><div class="item-sub">${posName[target.pos]} · ${target.age} лет · рейтинг ${target.rating}</div></div><span class="badge">${money(playerValue(target))}</span></div></div><p>Доплата тебе: <strong>${money(cash)}</strong></p><div class="actions"><button id="acceptIncoming">Принять</button><button class="secondary" id="rejectIncoming">Отклонить</button></div></div></div>`;
 $('#acceptIncoming').onclick=()=>{const ff=foreignCount(t)-(target.country!=='Россия'?1:0)+(player.country!=='Россия'?1:0);if(!unlimited(t)&&ff>5){toast('Лимит легионеров не позволяет принять сделку');return}other.players=other.players.filter(p=>p.id!==player.id);t.players=t.players.filter(p=>p.id!==target.id);player.teamId=t.id;target.teamId=other.id;t.players.push(player);other.players.push(target);t.cash+=cash;other.cash-=cash;addNews('Ты принял предложение «'+other.name+'»: '+player.name+' перешёл в команду, '+target.name+' отправился в обратном направлении.','good');root.innerHTML='';saveSilent();render()};
 $('#rejectIncoming').onclick=()=>{addNews('Ты отклонил предложение об обмене от клуба «'+other.name+'».');root.innerHTML='';saveSilent();render()};
}
function rosterPage(el){
 const t=activeTeam(),players=t.players.filter(p=>!p.system),forwards=players.filter(p=>['Ц','ЛК','ПК'].includes(p.pos)).sort((a,b)=>b.rating-a.rating),defs=players.filter(p=>['ЛЗ','ПЗ'].includes(p.pos)).sort((a,b)=>b.rating-a.rating),goalies=players.filter(p=>p.pos==='ВР').sort((a,b)=>b.rating-a.rating);
 const lines=Array.from({length:4},(_,i)=>({f:forwards.slice(i*3,i*3+3),d:defs.slice(i*2,i*2+2)}));
 el.innerHTML=`<div class="panel"><div class="row"><div><h2>Состав команды</h2><div class="muted small">Четыре пятёрки · 12 нападающих · 8 защитников · 2 вратаря</div></div><button id="autoLineup" class="secondary">Автосостав</button></div><div class="lines" style="margin-top:14px">${lines.map((line,i)=>`<div class="line-block"><h3>${i+1}-Я ПЯТЁРКА</h3><div class="line-slots">${[0,1,2].map(j=>slotSelect('f'+i+'-'+j,line.f[j]?.id,forwards,`Нападающий ${j+1}`)).join('')}${[0,1].map(j=>slotSelect('d'+i+'-'+j,line.d[j]?.id,defs,`Защитник ${j+1}`)).join('')}</div></div>`).join('')}</div><h3 style="margin-top:18px">Вратари</h3><div class="goalies"><div><label>Основной вратарь${slotSelect('starter',goalies[0]?.id,goalies,'Выбери вратаря')}</label></div><div><label>Запасной вратарь${slotSelect('backup',goalies[1]?.id,goalies,'Выбери вратаря')}</label></div></div><div class="notice" style="margin-top:14px">Изменения в расстановке сохраняются автоматически. Игровая сила пятёрок влияет на результат симуляции.</div></div><div class="panel" style="margin-top:14px"><div class="row"><h2>Игроки команды</h2><span class="badge">${players.length} полевых и вратарей</span></div><div class="table-wrap"><table><thead><tr><th>Игрок</th><th>Поз.</th><th>Возраст</th><th>Рейтинг</th><th>Страна</th><th>Стоимость</th><th>Зарплата</th></tr></thead><tbody>${players.sort((a,b)=>b.rating-a.rating).map(p=>`<tr><td><strong>${p.name}</strong>${p.injury?` <span class="badge bad">Травма ${p.injury} нед.</span>`:''}</td><td>${p.pos}</td><td>${p.age}</td><td><strong style="color:var(--gold)">${p.rating}</strong></td><td>${p.country}</td><td>${money(playerValue(p))}</td><td>${money(p.salary)}</td></tr>`).join('')}</tbody></table></div></div>`;
 el.querySelectorAll('[data-slot]').forEach(s=>s.onchange=()=>{const key=s.dataset.slot;state.lineup=state.lineup||{};state.lineup[key]=s.value;saveSilent()});
 $('#autoLineup').onclick=()=>{state.lineup={};render();toast('Автосостав выбран')};
}
function slotSelect(key,selected,players,placeholder){return `<div class="slot"><select data-slot="${key}"><option value="">${placeholder}</option>${players.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.name} · ${p.rating}</option>`).join('')}</select></div>`}
function trainingPage(el){
 const t=activeTeam(),players=t.players.filter(p=>!p.system).sort((a,b)=>b.rating-a.rating);
 el.innerHTML=`<div class="grid"><div class="panel"><h2>Еженедельная тренировка</h2><p class="muted">Выбери трёх игроков разных позиций. Тренировка проходит автоматически при нажатии «Провести тренировку». Рейтинг и стоимость игрока могут вырасти.</p><div class="player-grid">${players.map(p=>`<label class="player"><span><input type="checkbox" data-train="${p.id}" style="width:auto" ${selectedTraining.includes(p.id)?'checked':''} ${state.trainingUsed?'disabled':''}> Выбрать</span><strong>${p.name}</strong><span class="muted small">${posName[p.pos]} · ${p.age} лет</span><span class="rating">${p.rating}</span><span class="muted small">${money(playerValue(p))}</span></label>`).join('')}</div><div class="actions" style="margin-top:14px"><button id="doTraining" ${state.trainingUsed?'disabled':''}>Провести тренировку</button><button class="secondary" id="clearTraining">Сбросить выбор</button></div>${state.trainingUsed?'<div class="notice gold" style="margin-top:12px">На этой неделе тренировка уже проведена. Новая возможность появится на следующей неделе.</div>':''}</div><div class="panel"><h2>Как работает развитие</h2><div class="card-list"><div class="item"><span>Игроки до 23 лет</span><span class="badge good">Быстрый рост</span></div><div class="item"><span>23–29 лет</span><span class="badge">Стабильность</span></div><div class="item"><span>30+ лет</span><span class="badge warn">Риск спада</span></div></div><p class="muted small" style="margin-top:12px">Одна тренировка в неделю. Выбирай не больше трёх хоккеистов и не повторяй позицию. Улучшение зависит от возраста, рейтинга и случайного фактора.</p></div></div>`;
 el.querySelectorAll('[data-train]').forEach(c=>c.onchange=()=>{if(c.checked){if(!selectedTraining.includes(c.dataset.train))selectedTraining.push(c.dataset.train)}else selectedTraining=selectedTraining.filter(x=>x!==c.dataset.train);if(selectedTraining.length>3){selectedTraining.pop();c.checked=false;toast('Можно выбрать максимум трёх игроков')}});
 $('#clearTraining').onclick=()=>{selectedTraining=[];render()};
 $('#doTraining').onclick=()=>{const chosen=selectedTraining.map(getPlayer).filter(p=>p&&p.teamId===t.id);if(chosen.length!==3){toast('Выбери ровно трёх игроков');return}if(new Set(chosen.map(p=>p.pos)).size!==3){toast('Игроки должны быть разных позиций');return}let messages=[];chosen.forEach(p=>{let gain=rng(1,3)+(p.age<23?1:0);p.rating=clamp(p.rating+gain,1,100);messages.push(p.name+' улучшил рейтинг до '+p.rating)});state.trainingUsed=true;addNews('Тренировка: '+messages.join('; ')+'.','good');selectedTraining=[];saveSilent();render();toast('Тренировка завершена')};
}
function staffPage(el){
 const t=activeTeam();el.innerHTML=`<div class="panel"><h2>Тренерский штаб</h2><p class="muted">Твой главный тренер — ты. Остальных специалистов можно переманить из других клубов за компенсацию. Более сильный штаб помогает команде играть стабильнее.</p><div class="player-grid"><div class="player"><span class="badge good">ГЛАВНЫЙ ТРЕНЕР</span><strong style="margin-top:10px">Ты</strong><span class="muted small">Контракт с клубом</span><span class="rating">${t.coachRating}</span><span class="muted small">Влияет на результаты команды</span></div>${t.staff.map((s,i)=>`<div class="player"><span class="badge">${s.role}</span><strong style="margin-top:10px">${s.name}</strong><span class="muted small">Контракт специалиста</span><span class="rating">${s.rating}</span><span class="muted small">Выкуп: ${money(s.cost)}</span><button style="margin-top:10px;width:100%" data-buy-staff="${i}">Усилить штаб</button></div>`).join('')}</div><div class="notice" style="margin-top:14px">В этой версии можно улучшить каждого специалиста за деньги клуба. Переманивание реальных сотрудников других команд можно расширить в следующем обновлении.</div></div>`;
 el.querySelectorAll('[data-buy-staff]').forEach(b=>b.onclick=()=>{const s=t.staff[+b.dataset.buyStaff];if(t.cash<s.cost){toast('Недостаточно денег');return}t.cash-=s.cost;s.rating=clamp(s.rating+rng(4,9),1,100);s.cost=Math.round(s.cost*1.25);addNews('Клуб инвестировал в штаб: рейтинг специалиста «'+s.role+'» вырос до '+s.rating+'.','good');saveSilent();render()});

function systemPage(el){

 el.innerHTML=`<div class="grid"><div class="panel"><h2>Система клуба</h2><p class="muted">В системе клуба находятся молодые игроки. Командируй их в основную команду или отправляй обратно в фарм-клубы ВХЛ и МХЛ. После смены уровня игрок может прибавить или потерять рейтинг.</p><div class="card-list">${prospects.map(p=>`<div class="item"><div class="item-left"><div class="item-title">${p.name}</div><div class="item-sub">${posName[p.pos]} · ${p.age} лет · ${p.country} · ${p.system?'МХЛ / ВХЛ':''}</div></div><div style="text-align:right"><strong style="color:var(--gold)">${p.rating}</strong><div class="actions" style="margin-top:5px"><button data-promote="${p.id}">В основу</button></div></div></div>`).join('')||'<div class="empty">В системе нет игроков.</div>'}</div></div><div class="panel"><h2>Фарм-клубы</h2><div class="item"><div>${t.name} — ВХЛ<div class="item-sub">Ближайший резерв основной команды</div></div><span class="badge">ВХЛ</span></div><div class="item" style="margin-top:8px"><div>${t.name} — МХЛ<div class="item-sub">Молодёжное развитие</div></div><span class="badge">МХЛ</span></div><h3 style="margin-top:18px">Игроки основы, которых можно отправить</h3><div class="card-list">${t.players.filter(p=>!p.system&&p.age<25).slice(0,12).map(p=>`<div class="item"><div><strong>${p.name}</strong><div class="item-sub">${p.pos} · ${p.age} лет · рейтинг ${p.rating}</div></div><button class="secondary" data-demote="${p.id}">В систему</button></div>`).join('')}</div></div></div>`;
 el.querySelectorAll('[data-promote]').forEach(b=>b.onclick=()=>{const p=getPlayer(b.dataset.promote);p.system=false;let delta=rng(-2,3);p.rating=clamp(p.rating+delta,1,100);addNews(p.name+' переведён из системы в основу. Изменение рейтинга: '+(delta>=0?'+':'')+delta+'.',delta>=0?'good':'bad');saveSilent();render()});
 el.querySelectorAll('[data-demote]').forEach(b=>b.onclick=()=>{const p=getPlayer(b.dataset.demote);if(p.age>22){toast('В систему можно отправлять игроков до 23 лет');return}p.system=true;let delta=rng(-1,3);p.rating=clamp(p.rating+delta,1,100);addNews(p.name+' отправлен в систему клуба. Изменение рейтинга: '+(delta>=0?'+':'')+delta+'.',delta>=0?'good':'bad');saveSilent();render()});
}
function leaguePage(el){
 const t=activeTeam(),west=standings('Запад'),east=standings('Восток');
 const results=t.schedule.filter(g=>g.played).sort((a,b)=>b.day-a.day).slice(0,20);
 el.innerHTML=`<div class="grid"><div class="panel"><h2>Западная конференция</h2>${standingsTable(west,t.id)}<h2 style="margin-top:20px">Восточная конференция</h2>${standingsTable(east,t.id)}</div><div class="stack"><div class="panel"><h2>Матчи «${t.name}»</h2><div class="muted small">Всего 68 игр регулярного чемпионата</div><div class="card-list" style="margin-top:12px">${results.length?results.map(g=>{const home=state.teams[g.home],away=state.teams[g.away];return `<div class="item"><div><div class="item-title">${home.name} — ${away.name}</div><div class="item-sub">Матч ${g.day}</div></div><strong>${g.hg}:${g.ag}</strong></div>`}).join(''):'<div class="empty">Результатов пока нет.</div>'}</div></div><div class="panel"><h2>Календарь</h2><div class="card-list"><div class="item"><span>Регулярный чемпионат</span><strong>${t.schedule.filter(g=>g.played).length}/68</strong></div><div class="item"><span>Плей-офф</span><strong>${state.phase==='playoffs'?'Идёт':'Впереди'}</strong></div><div class="item"><span>Матч звёзд</span><strong>${state.allStarDone?'Проведён':'Впереди'}</strong></div><div class="item"><span>Кубок Первого канала</span><strong>${state.cupDone?'Проведён':'Впереди'}</strong></div></div><button class="secondary" style="margin-top:12px;width:100%" id="fullSchedule">Показать календарь сезона</button></div></div></div>`;
 $('#fullSchedule').onclick=()=>{const root=$('#modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="row"><h2>Календарь команды</h2><button class="secondary" id="closeSchedule">Закрыть</button></div><div class="table-wrap"><table><thead><tr><th>Матч</th><th>Соперник</th><th>Площадка</th><th>Результат</th></tr></thead><tbody>${t.schedule.sort((a,b)=>a.day-b.day).map(g=>`<tr><td>${g.day}</td><td>${opponent(g).name}</td><td>${g.home===t.id?'Дома':'В гостях'}</td><td>${g.played?g.hg+':'+g.ag:'—'}</td></tr>`).join('')}</tbody></table></div></div></div>`;$('#closeSchedule').onclick=()=>root.innerHTML=''};
}
function standingsTable(list,mine){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Клуб</th><th>И</th><th>В</th><th>ОТ</th><th>П</th><th>О</th></tr></thead><tbody>${list.map((t,i)=>`<tr class="${t.id===mine?'mine':''}"><td>${i+1}</td><td><strong>${esc(t.name)}</strong></td><td>${t.record.w+t.record.ot+t.record.l}</td><td>${t.record.w}</td><td>${t.record.ot}</td><td>${t.record.l}</td><td><strong>${t.record.pts}</strong></td></tr>`).join('')}</tbody></table></div>`}
function simulateAction(){
 if(state.phase==='preseason'){state.phase='regular';state.day=0;addNews('Регулярный чемпионат сезона '+state.season+'/'+(state.season+1)+' официально стартовал.');toast('Сезон начался');saveSilent();render();return}
 if(state.phase==='regular'){simulateNext();return}
 if(state.phase==='playoffs'){simulatePlayoff();return}
 nextWeek();
}
function teamStrength(t){
 const players=t.players.filter(p=>!p.system&&p.injury===0),f=players.filter(p=>p.pos!=='ВР'),g=players.filter(p=>p.pos==='ВР');
 const top=f.sort((a,b)=>b.rating-a.rating).slice(0,18);
 return avg(top.map(p=>p.rating))*0.76+(Math.max(...g.map(p=>p.rating),45))*0.18+avg(t.staff.map(s=>s.rating))*0.04+t.coachRating*.02;
}
function simulateNext(){
 const g=nextGame();if(!g){endRegular();return}
 // Move to this team's next scheduled game and simulate all games up to that date.
 const day=g.day;
 const today=state.schedule.filter(x=>!x.played&&x.day<=day);
 today.forEach(game=>playGame(game));
 state.day=day;state.trainingUsed=false;
 maybeEvents();
 const result=state.lastResult;
 addNews('Тур '+day+': сыграны матчи лиги. '+(result&&result.gameId===g.id?result.text:''));
 if(activeTeam().schedule.every(x=>x.played)){endRegular();return}
 saveSilent();render();
}
function playGame(g){
 if(g.played)return;
 const home=state.teams[g.home],away=state.teams[g.away];
 const homePow=teamStrength(home)+3,awayPow=teamStrength(away),diff=homePow-awayPow;
 let hg=poissonLike(2.65+diff*.085),ag=poissonLike(2.45-diff*.085);
 hg=clamp(hg,0,8);ag=clamp(ag,0,8);
 if(hg===ag){if(Math.random()<.5)hg++;else ag++}
 g.hg=hg;g.ag=ag;g.played=true;
 recordResult(home,away,hg,ag);
 if(g.home===state.userTeam||g.away===state.userTeam){
 const isHome=g.home===state.userTeam,forUs=isHome?hg:ag,against=isHome?ag:hg,opp=isHome?away:home;
 state.lastResult={gameId:g.id,text:`${activeTeam().name} ${forUs}:${against} ${opp.name}.`};
 if(forUs>against)addNews('Победа! '+activeTeam().name+' обыграл клуб «'+opp.name+'» со счётом '+forUs+':'+against+'.','good');
 else addNews('Поражение: '+activeTeam().name+' уступил «'+opp.name+'» со счётом '+forUs+':'+against+'.','bad');
 }
}
function poissonLike(mean){let x=Math.floor(mean);if(Math.random()<mean-x)x++;if(Math.random()<.15)x++;return x}
function recordResult(home,away,hg,ag){
 home.record.gf+=hg;home.record.ga+=ag;away.record.gf+=ag;away.record.ga+=hg;
 if(hg>ag){home.record.w++;home.record.pts+=2;away.record.l++}
 else{away.record.w++;away.record.pts+=2;home.record.l++}
}
function maybeEvents(){
 const t=activeTeam();
 if(Math.random()<.24){const candidates=t.players.filter(p=>!p.system&&p.injury===0);if(candidates.length){const p=candidates[rng(0,candidates.length-1)];p.injury=rng(1,4);addNews('Медицинский штаб сообщил о травме игрока '+p.name+'. Ожидаемый срок восстановления — '+p.injury+' нед.','bad')}}
 if(Math.random()<.16)receiveOffer();
 state.teams.forEach(tm=>tm.players.forEach(p=>{if(p.injury>0)p.injury--}));
}
function endRegular(){
 state.phase='playoffs';state.playoffRound=1;
 const qualifiers=['Запад','Восток'].flatMap(c=>standings(c).slice(0,8).map(t=>t.id));
 state.playoffs=[];for(let i=0;i<8;i++){state.playoffs.push({a:qualifiers[i],b:qualifiers[15-i],wa:0,wb:0,done:false});}
 addNews('Регулярный чемпионат завершён. Начинается плей-офф Кубка Гагарина — по восемь лучших клубов каждой конференции.','good');
 render();
}
function simulatePlayoff(){
 // Simplified cross-conference knockout. Each matchup is a best-of-seven series, one click simulates a game.
 if(!state.playoffs.length){newSeason();return}
 const series=state.playoffs.find(s=>!s.done);
 if(!series){const winners=state.playoffs.map(s=>s.wa>s.wb?s.a:s.b);state.playoffRound++;if(winners.length===1){addNews('Кубок Гагарина выиграл клуб «'+state.teams[winners[0]].name+'»!','good');state.phase='offseason';render();return}state.playoffs=[];for(let i=0;i<winners.length;i+=2)state.playoffs.push({a:winners[i],b:winners[i+1],wa:0,wb:0,done:false});render();return}
 const a=state.teams[series.a],b=state.teams[series.b],pa=teamStrength(a),pb=teamStrength(b);
 const ag=clamp(poissonLike(2.5+(pa-pb)*.08),0,7),bg=clamp(poissonLike(2.5+(pb-pa)*.08),0,7);
 if(ag===bg){if(Math.random()<.5)series.wa++;else series.wb++}else if(ag>bg)series.wa++;else series.wb++;
 addNews('Плей-офф: '+a.name+' — '+b.name+', матч '+ag+':'+bg+'. Серия '+series.wa+':'+series.wb+'.');
 if(series.wa===4||series.wb===4)series.done=true;
 saveSilent();render();
}
function nextWeek(){
 state.week++;state.trainingUsed=false;
 if(state.phase==='offseason'&&state.week>8){newSeason();return}
 if(state.week%3===0&&!state.allStarDone){state.allStarDone=true;addNews('Матч звёзд КХЛ: несколько игроков твоего клуба приглашены в одну из четырёх команд, а ты вошёл в тренерский штаб.','good')}
 if(state.week%5===0&&!state.cupDone){state.cupDone=true;addNews('Кубок Первого канала: игроки клуба получили вызовы в сборную, тебя пригласили в тренерский штаб.','good')}
 state.teams.forEach(t=>t.players.forEach(p=>{if(p.injury>0)p.injury--;if(p.retiring)return;if(Math.random()<.02){if(p.age<24)p.rating=clamp(p.rating+rng(0,2),1,100);if(p.age>31)p.rating=clamp(p.rating-rng(0,2),1,100)}}));
 addNews('Началась новая неделя. Игроки восстановились, тренировки снова доступны.');saveSilent();render();
}
function newSeason(){
 state.season++;state.week=1;state.day=0;state.phase='preseason';state.seasonEnded=false;state.allStarDone=false;state.cupDone=false;state.trainingUsed=false;
 state.teams.forEach(t=>{t.record={w:0,ot:0,l:0,gf:0,ga:0,pts:0};t.players.forEach(p=>{p.age++;p.injury=0;let delta=p.age<24?rng(0,3):p.age>31?-rng(0,3):rng(-1,1);p.rating=clamp(p.rating+delta,1,100);if(p.age>=39&&Math.random()<.4){t.players=t.players.filter(x=>x.id!==p.id);addNews(p.name+' завершил профессиональную карьеру.')}});});
 const newSchedule=[];let counts=Array(22).fill(0);const pairs=[];for(let i=0;i<22;i++)for(let j=i+1;j<22;j++){pairs.push({home:i,away:j},{home:j,away:i})}
 pairs.sort(()=>Math.random()-.5);for(const g of pairs){if(counts[g.home]<68&&counts[g.away]<68){newSchedule.push({...g,played:false,day:0,id:uid()});counts[g.home]++;counts[g.away]++}}
 while(counts.some(c=>c<68)){let a=counts.indexOf(Math.min(...counts)),b=rng(0,21);if(a===b||counts[b]>=68)continue;newSchedule.push({home:a,away:b,played:false,day:0,id:uid()});counts[a]++;counts[b]++}
 newSchedule.sort(()=>Math.random()-.5).forEach((g,i)=>g.day=i+1);state.schedule=newSchedule;state.teams.forEach(t=>t.schedule=newSchedule.filter(g=>g.home===t.id||g.away===t.id).sort((a,b)=>a.day-b.day));state.playoffs=[];addNews('Начался новый сезон '+state.season+'/'+(state.season+1)+'. Проверь состав и бюджет.','good');saveSilent();render();
}
$('#saveBtn').onclick=save;
if(load()){render();}else{state=generateGame();showClubSelect()}
})();
</script>
</body></html>
