function createLeague(){

 CLUBS.forEach((club,ci)=>{

function setLineup(key,val){if(!S.lineup[S.club])S.lineup[S.club]={};if(val)S.lineup[S.club][key]=Number(val);else delete S.lineup[S.club][key];persist()}
function setGoalie(which,val){S.goalies[S.club][which]=val?Number(val):null;persist()}
function autoLineup(){const roster=myPlayers(),used=new Set(),line={};const slots=[["Ц","ЛК","ПК","ЛЗ","ПЗ"],["Ц","ЛК","ПК","ЛЗ","ПЗ"],["Ц","ЛК","ПК","ЛЗ","ПЗ"],["Ц","ЛК","ПК","ЛЗ","ПЗ"]];slots.forEach((arr,i)=>arr.forEach((pos,j)=>{const p=roster.filter(x=>x.pos===pos&&!used.has(x.id)).sort((a,b)=>b.rating-a.rating)[0];if(p){line[`${i}-${j}`]=p.id;used.add(p.id)}}));S.lineup[S.club]=line;const g=roster.filter(p=>p.pos==="ВР").sort((a,b)=>b.rating-a.rating);S.goalies[S.club]={starter:g[0]?.id||null,backup:g[1]?.id||null};render();notify("Состав расставлен по рейтингу")}
function clearLineup(){S.lineup[S.club]={};S.goalies[S.club]={starter:null,backup:null};render();notify("Расстановка очищена")}
function playerDetails(id){const p=S.players.find(x=>x.id===id);if(!p)return;const c=clubBy(p.club);openModal(`<h2>${esc(p.first)} ${esc(p.last)}</h2><div class="detail-grid"><div class="detail"><span>Клуб</span><strong>${esc(c.name)}</strong></div><div class="detail"><span>Позиция</span><strong>${p.pos}</strong></div><div class="detail"><span>Рейтинг</span><strong>${p.rating}/100</strong></div><div class="detail"><span>Возраст</span><strong>${p.age}</strong></div><div class="detail"><span>Национальность</span><strong>${p.flag} ${esc(p.nat)}</strong></div><div class="detail"><span>Потенциал</span><strong>${p.potential}</strong></div><div class="detail"><span>Стоимость</span><strong>${money(playerValue(p))}</strong></div><div class="detail"><span>Зарплата</span><strong>${money(p.salary)}</strong></div><div class="detail"><span>Контракт</span><strong>${p.contract} г.</strong></div></div><div class="actions"><button onclick="closeModal();offerPlayer(${p.id})">Предложить обмен</button><button class="secondary" onclick="closeModal()">Закрыть</button></div>`)}
function trainingPage(){const trained=S.trained||[];return `<div class="grid"><section class="card"><div class="section-head"><h2>Еженедельные тренировки</h2><span class="pill ${trained.length>=3?"warn":"good"}">${trained.length}/3 выбрано</span></div><p class="muted">Выбери максимум трёх игроков, по одному на каждую позиционную группу: нападающий, защитник, вратарь. После перехода недели игроки тренируются автоматически. Молодые игроки обычно получают больший прирост.</p><div class="player-grid">${myPlayers().filter(p=>p.pos!=="ВР"&&!trained.includes(p.id)).sort((a,b)=>b.rating-a.rating).map(p=>`<div class="player-card"><div class="player-card-head"><div><h3>${esc(p.first)} ${esc(p.last)}</h3><p>${p.pos} · ${p.age} лет</p></div>${badgeRating(p.rating)}</div><p>Потенциал: ${p.potential}</p><button class="secondary small" onclick="selectTraining(${p.id})" ${trained.length>=3?"disabled":""}>Выбрать</button></div>`).join("")}</div><h3 style="margin-top:18px">Вратари</h3><div class="player-grid">${myPlayers().filter(p=>p.pos==="ВР"&&!trained.includes(p.id)).map(p=>`<div class="player-card"><div class="player-card-head"><div><h3>${esc(p.first)} ${esc(p.last)}</h3><p>Вратарь · ${p.age} лет</p></div>${badgeRating(p.rating)}</div><button class="secondary small" onclick="selectTraining(${p.id})" ${trained.length>=3?"disabled":""}>Выбрать</button></div>`).join("")}</div><div class="actions"><button onclick="advanceWeek()">Следующая неделя →</button><button class="secondary" onclick="clearTraining()">Сбросить выбор</button></div></section><section class="card"><h2>Прогресс команды</h2><div class="stats"><div class="stat"><span>Выбрано</span><strong>${trained.length}/3</strong></div><div class="stat"><span>Неделя</span><strong>${S.week}</strong></div><div class="stat"><span>Сезон</span><strong>${S.season}</strong></div><div class="stat"><span>Травмированы</span><strong>${myPlayers().filter(p=>p.injury>0).length}</strong></div></div><p class="muted" style="margin-top:12px">Тренировка повышает рейтинг примерно на 1–2 пункта, если игрок не достиг своего потенциала. Вратарь занимает отдельную позиционную группу.</p></section></div>`}
function selectTraining(id){const p=S.players.find(x=>x.id===id);if(!p)return;const group=p.pos==="ВР"?"ВР":["ЛЗ","ПЗ"].includes(p.pos)?"З":"Н";for(const oldId of S.trained){const old=S.players.find(x=>x.id===oldId);const oldGroup=old.pos==="ВР"?"ВР":["ЛЗ","ПЗ"].includes(old.pos)?"З":"Н";if(oldGroup===group){notify("Уже выбран игрок этой группы");return}}if(S.trained.length>=3){notify("Максимум три игрока за неделю");return}S.trained.push(id);render()}
function clearTraining(){S.trained=[];render()}
function advanceWeek(){let improved=[];for(const id of S.trained){const p=S.players.find(x=>x.id===id);if(p&&p.rating<p.potential){const gain=p.age<=23?2:p.age<=29?1:Math.random()<.4?1:0;p.rating=Math.min(p.potential,p.rating+gain);if(gain)improved.push(`${p.last} +${gain}`)}}S.players.filter(p=>p.club===S.club).forEach(p=>{if(p.injury>0)p.injury--});S.week++;S.trained=[];S.budget+=Math.round(myClub().budget/52);if(Math.random()<.22){const p=myPlayers().filter(p=>p.injury===0)[Math.floor(Math.random()*myPlayers().filter(p=>p.injury===0).length)];if(p){p.injury=1+Math.floor(Math.random()*4);addNews("Медицинский штаб",`${p.first} ${p.last} получил повреждение на тренировке. Срок восстановления — ${p.injury} нед.`,"warn")}}addNews("Новая неделя",improved.length?`Итоги тренировок: ${improved.join(", ")}.`:"Команда провела плановую тренировочную неделю.");if(S.week%4===0)updateAging();persist();render();notify("Неделя завершена")}
function updateAging(){S.players.forEach(p=>{if(p.club===S.club){if(p.age<24&&p.rating<p.potential)p.rating=Math.min(p.potential,p.rating+1);else if(p.age>=32)p.rating=Math.max(45,p.rating-1);p.age+=1;p.contract=Math.max(0,p.contract-1)}});addNews("Обновление игроков","Возраст и контракты игроков обновлены по итогам игрового года.")}
function staffPage(){const st=S.staff[S.club];const staff=[["assistant","Второй тренер"],["fitness","Тренер по физподготовке"],["doctor","Врач"],["goalie","Тренер вратарей"]];return `<div class="grid"><section class="card"><div class="section-head"><h2>Тренерский штаб</h2><span class="pill">Главный тренер: ты</span></div><div class="player-grid"><div class="player-card"><div class="player-card-head"><div><h3>Ты</h3><p>Главный тренер</p></div>${badgeRating(76)}</div><p>Контракт: до конца сезона</p></div>${staff.map(([k,title])=>`<div class="player-card"><div class="player-card-head"><div><h3>${esc(st[k].name)}</h3><p>${title}</p></div>${badgeRating(st[k].rating)}</div><p>Зарплата: ${money(st[k].salary)} / сезон</p><p>Выкуп из другого клуба пока доступен как игровое событие будущей версии.</p></div>`).join("")}</div></section><section class="card"><h2>Финансовая модель</h2><div class="stats"><div class="stat"><span>Доступный бюджет</span><strong>${money(S.budget)}</strong></div><div class="stat"><span>Зарплатный фонд</span><strong>${money(myPlayers().reduce((a,p)=>a+p.salary,0))}</strong></div><div class="stat"><span>Бюджет клуба</span><strong>${money(myClub().budget)}</strong></div><div class="stat"><span>Остаток контракта</span><strong>Сезон</strong></div></div><p class="muted" style="margin-top:12px">Финансовые показатели — приблизительные игровые оценки в млн ₽, а не официальная отчётность клубов.</p></section></div>`}
function systemPage(){const farm=myPlayers().filter(p=>p.age<=21).sort((a,b)=>b.rating-a.rating);const other=S.players.filter(p=>p.club!==S.club&&p.age<=21).slice(0,20);return `<div class="grid"><section class="card"><div class="section-head"><h2>Система клуба</h2><span class="pill">ВХЛ + МХЛ</span></div><p class="muted">Молодые игроки могут развиваться в фарм-клубах. В этой версии отправка в систему и вызов в основу доступны; отдельная симуляция матчей ВХЛ/МХЛ будет добавлена позднее.</p><h3>Молодые игроки основного клуба</h3><div class="player-grid">${farm.map(p=>`<div class="player-card"><div class="player-card-head"><div><h3>${esc(p.first)} ${esc(p.last)}</h3><p>${p.pos} · ${p.age} лет</p></div>${badgeRating(p.rating)}</div><p>Потенциал ${p.potential}</p><div class="actions"><button class="secondary small" onclick="sendFarm(${p.id})">Отправить в систему</button></div></div>`).join("")}</div></section><section class="card"><h2>Командировать в основу</h2><p class="muted">Игроки системы других клубов доступны как кандидаты для будущих переговоров. Полноценная система контрактов и молодёжных клубов будет расширена в следующей итерации.</p><div class="notice">Текущий режим: у каждого клуба есть молодые игроки в общем пуле. Командировка в основу пока ограничена игроками, уже принадлежащими твоему клубу.</div></section></div>`}
function sendFarm(id){const p=S.players.find(x=>x.id===id);if(!p)return;if(p.age>21){notify("В систему можно отправить игрока до 22 лет");return}p.rating=Math.max(45,p.rating+(Math.random()<.65?1:-1));addNews("Система клуба",`${p.first} ${p.last} отправлен в фарм-клуб. Рейтинг после адаптации: ${p.rating}.`);notify("Игрок отправлен в систему (упрощённый режим)");render()}
function leaguePage(){const table=CLUBS.map(c=>{const games=S.results.filter(r=>r.phase!=="playoff"&&(r.home===c.id||r.away===c.id));let w=0,l=0,ot=0,gf=0,ga=0;games.forEach(r=>{let isHome=r.home===c.id,forG=isHome?r.hg:r.ag,against=isHome?r.ag:r.hg;gf+=forG;ga+=against;if(forG>against)w++;else if(r.ot)ot++;else l++});return{...c,gp:games.length,w,l,ot,pts:w*2+ot,gf,ga}}).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));return `<div class="grid"><section class="card"><div class="section-head"><h2>Таблица конференций</h2><span class="pill">Завершено туров: ${S.round||0}/68</span></div><div class="conference-title">Восточная конференция</div>${standingsTable(table.filter(c=>c.conf==="Восток"))}<div class="conference-title">Западная конференция</div>${standingsTable(table.filter(c=>c.conf==="Запад"))}</section><section class="card"><div class="section-head"><h2>Результаты твоей команды</h2><span class="pill">${myResults().length}/68</span></div>${myResults().length?`<div class="table-wrap"><table><thead><tr><th>№</th><th>Матч</th><th>Счёт</th><th>Итог</th></tr></thead><tbody>${myResults().map((r,i)=>{const home=r.home===S.club,opp=clubBy(home?r.away:r.home),mine=home?r.hg:r.ag,theirs=home?r.ag:r.hg;return `<tr><td>${i+1}</td><td>${home?"Д":"В"} · ${esc(opp.name)}</td><td><b>${mine}:${theirs}</b></td><td><span class="pill ${mine>theirs?"good":r.ot&&mine<theirs?"warn":"bad"}">${mine>theirs?"Победа":r.ot&&mine<theirs?"Поражение ОТ":"Поражение"}</span></td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">Матчи ещё не сыграны. Перейди на главную и симулируй следующий матч.</div>`}<div class="actions"><button onclick="simulateNext()" ${myResults().length>=68?"disabled":""}>Сыграть следующий матч</button><button class="secondary" onclick="simulateToNext()">Симулировать 5 матчей</button></div></section></div>`}
function standingsTable(list){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Клуб</th><th>И</th><th>В</th><th>П</th><th>ОТ</th><th>О</th><th>Ш</th></tr></thead><tbody>${list.map((c,i)=>`<tr><td>${i+1}</td><td>${clubLogo(c)} <b>${esc(c.name)}</b></td><td>${c.gp}</td><td>${c.w}</td><td>${c.l}</td><td>${c.ot}</td><td><b>${c.pts}</b></td><td>${c.gf}-${c.ga}</td></tr>`).join("")}</tbody></table></div>`}
function myResults(){return S.results.filter(r=>r.home===S.club||r.away===S.club)}
function teamPower(id){const ps=S.players.filter(p=>p.club===id&&p.injury===0);const sk=ps.filter(p=>p.pos!=="ВР").sort((a,b)=>b.rating-a.rating).slice(0,18);const g=ps.filter(p=>p.pos==="ВР").sort((a,b)=>b.rating-a.rating)[0];const lineup=S.lineup[id]||{};let penalty=0;if(id===S.club){const filled=Object.keys(lineup).length;penalty=filled<15?(15-filled)*.25:0}return (sk.reduce((a,p)=>a+p.rating,0)/Math.max(1,sk.length))*.78+(g?g.rating:65)*.22-penalty}
function scheduleRound(round){
 const ids=CLUBS.map(c=>c.id), n=ids.length, cycle=Math.floor(round/21), base=round%21;
 let arr=ids.slice(); for(let k=0;k<base;k++){const last=arr.pop();arr.splice(1,0,last)}
 const games=[];for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if((cycle+base+i)%2){const t=a;a=b;b=t}games.push({home:a,away:b})}return games;
}
function creditTeamStats(teamId,goals,opponentGoals){const roster=S.players.filter(p=>p.club===teamId&&p.pos!=="ВР"&&p.injury===0);const all=S.players.filter(p=>p.club===teamId&&p.injury===0);all.forEach(p=>{p.gp=(p.gp||0)+1});for(let i=0;i<goals;i++){const scorerPool=roster.length?roster:all;if(!scorerPool.length)break;const scorer=scorerPool[Math.floor(Math.random()*scorerPool.length)];scorer.goals=(scorer.goals||0)+1;scorer.points=(scorer.points||0)+1;scorer.plusMinus=(scorer.plusMinus||0)+(goals>=opponentGoals?1:-1);if(Math.random()<.72&&scorerPool.length>1){let assister=scorerPool[Math.floor(Math.random()*scorerPool.length)];if(assister.id===scorer.id)assister=scorerPool.find(p=>p.id!==scorer.id)||assister;if(assister.id!==scorer.id){assister.assists=(assister.assists||0)+1;assister.points=(assister.points||0)+1;}}}}
function simulateGame(homeId,awayId,round,phase="regular"){
 const hp=teamPower(homeId)+(Math.random()*10-5)+1.8,ap=teamPower(awayId)+(Math.random()*10-5);
 let hg=Math.max(0,Math.round(2.15+(hp-75)*.105+Math.random()*2.5)),ag=Math.max(0,Math.round(2.05+(ap-75)*.105+Math.random()*2.5));
 let ot=false;if(hg===ag){ot=true;if(Math.random()<.5)hg++;else ag++;}
 creditTeamStats(homeId,hg,ag);creditTeamStats(awayId,ag,hg);
 return {home:homeId,away:awayId,hg,ag,ot,season:S.season,round,phase};
}
function simulateNext(){
 if(!S.club)return;
 if(S.phase==="playoff"){simulatePlayoffDay();return}
 if(S.phase!=="regular"){notify("Начни следующий сезон в разделе «Контракты»");return}
 if((S.round||0)>=68){beginPlayoffs();render();return}
 const r=S.round||0, games=scheduleRound(r);
 games.forEach(g=>{const result=simulateGame(g.home,g.away,r+1);S.results.push(result);if(g.home===S.club||g.away===S.club){addNews("Итог матча",`${clubBy(g.home).name} — ${clubBy(g.away).name}: ${result.hg}:${result.ag}${result.ot?" (овертайм)":""}.`);if(Math.random()<.1){const roster=myPlayers().filter(p=>p.injury===0);if(roster.length){const p=roster[Math.floor(Math.random()*roster.length)];p.injury=1+Math.floor(Math.random()*3);addNews("Травма игрока",`${p.first} ${p.last} пропустит ${p.injury} нед.` ,"warn")}}}});
 S.round=r+1;S.week=S.round+1;S.players.forEach(p=>{if(p.injury>0)p.injury=Math.max(0,p.injury-1)});S.trained=[];S.budget+=Math.round(myClub().budget*.004);
 if(S.round>=68)beginPlayoffs();persist();render();const mine=myResults().filter(x=>x.round===S.round).slice(-1)[0];notify(`Тур ${S.round}/68 завершён${mine?`: ${mine.hg}:${mine.ag}`:""}`)
}
function simulateToNext(){if(S.phase==="playoff"){for(let i=0;i<5&&S.phase==="playoff";i++)simulatePlayoffDay()}else{for(let i=0;i<5&&S.round<68;i++)simulateNextSilent()}persist();render();notify("Симулировано до 5 туров")}
function simulateNextSilent(){if(S.phase!=="regular"||S.round>=68)return;const r=S.round||0;scheduleRound(r).forEach(g=>S.results.push(simulateGame(g.home,g.away,r+1)));S.round=r+1;S.week=S.round+1;S.players.forEach(p=>{if(p.injury>0)p.injury=Math.max(0,p.injury-1)});S.budget+=Math.round(myClub().budget*.004);S.trained=[];if(S.round>=68)beginPlayoffs()}
function leagueStandings(conf=null){return CLUBS.filter(c=>!conf||c.conf===conf).map(c=>{const games=S.results.filter(r=>r.phase!=="playoff"&&(r.home===c.id||r.away===c.id));let w=0,l=0,ot=0,gf=0,ga=0;games.forEach(r=>{const home=r.home===c.id,forG=home?r.hg:r.ag,against=home?r.ag:r.hg;gf+=forG;ga+=against;if(forG>against)w++;else if(r.ot)ot++;else l++});return{...c,gp:games.length,w,l,ot,pts:w*2+ot,gf,ga}}).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))}
function beginPlayoffs(){if(S.phase!=="regular")return;S.phase="playoff";const east=leagueStandings("Восток").slice(0,8),west=leagueStandings("Запад").slice(0,8);const series=[];for(const group of [east,west]){[[0,7],[3,4],[1,6],[2,5]].forEach(([a,b],i)=>series.push({id:`r1-${series.length+1}`,round:1,a:group[a].id,b:group[b].id,wa:0,wb:0,done:false,winner:null}))}S.playoff={round:1,series,champion:null};addNews("Плей-офф Кубка Гагарина",`Регулярный чемпионат завершён. В плей-офф вышли 16 клубов.`);}
function simulatePlayoffDay(){if(S.phase!=="playoff"||!S.playoff)return;const active=S.playoff.series.filter(x=>x.round===S.playoff.round&&!x.done);if(!active.length){advancePlayoffRound();return}active.forEach(s=>{const home=Math.random()<.5?s.a:s.b,away=home===s.a?s.b:s.a;const g=simulateGame(home,away,S.playoff.round,"playoff");if(g.hg===g.ag){if(Math.random()<.5)g.hg++;else g.ag++}S.playoffResults.push(g);const winner=g.hg>g.ag?g.home:g.away;if(winner===s.a)s.wa++;else s.wb++;if(s.wa===4||s.wb===4){s.done=true;s.winner=s.wa===4?s.a:s.b;addNews("Серия завершена",`${clubBy(s.winner).name} выиграл серию ${s.wa}:${s.wb}.`)} });
 if(S.playoff.series.filter(x=>x.round===S.playoff.round).every(x=>x.done))advancePlayoffRound();persist();render();notify("Игровой день плей-офф завершён")}
function advancePlayoffRound(){const old=S.playoff.round,prev=S.playoff.series.filter(x=>x.round===old);if(old===4){S.playoff.champion=prev[0]?.winner||null;S.phase="offseason";addNews("Обладатель Кубка Гагарина",`${clubBy(S.playoff.champion)?.name||"Клуб"} выиграл Кубок Гагарина!`);notify("Сезон завершён — Кубок Гагарина разыгран");return}
 const winners=prev.map(x=>x.winner).filter(Boolean),next=[];for(let i=0;i<winners.length;i+=2)next.push({id:`r${old+1}-${i/2+1}`,round:old+1,a:winners[i],b:winners[i+1],wa:0,wb:0,done:false,winner:null});S.playoff.series.push(...next);S.playoff.round=old+1;addNews("Следующий раунд",`Начинается раунд ${old+1} плей-офф.`)}
function marketPage(){const free=S.players.filter(p=>p.club==="FA").sort((a,b)=>b.rating-a.rating);return `<div class="grid"><section class="card"><div class="section-head"><h2>Свободные агенты</h2><span class="pill">${free.length} игроков</span></div><p class="muted">Игроки без клуба. Зарплата — годовая оценка в млн ₽. Подписание списывает бонус за переход из бюджета и добавляет зарплату в фонд клуба.</p><div class="player-grid">${free.map(p=>`<div class="player-card"><div class="player-card-head"><div><h3>${esc(p.first)} ${esc(p.last)}</h3><p>${p.flag} ${esc(p.nat)} · ${p.pos} · ${p.age} лет</p></div>${badgeRating(p.rating)}</div><p>Потенциал ${p.potential} · зарплата ${money(p.salary)} / год</p><p>Стоимость ${money(playerValue(p))}</p><div class="actions"><button class="small" onclick="signFreeAgent(${p.id})" ${S.budget<playerValue(p)*.25?"disabled":""}>Подписать</button></div></div>`).join("")||`<div class="empty">Свободных агентов нет.</div>`}</div></section></div>`}
function signFreeAgent(id){const p=S.players.find(x=>x.id===id&&x.club==="FA");if(!p)return;const cost=Math.round(playerValue(p)*.25);if(S.budget<cost){notify("Не хватает бюджета на бонус за подписание");return}p.club=S.club;p.contract=2+Math.floor(Math.random()*3);S.budget-=cost;addNews("Подписание игрока",`${p.first} ${p.last} подписал контракт с клубом на ${p.contract} сезона.`);persist();render();notify("Игрок подписан")}
function contractsPage(){const roster=myPlayers().slice().sort((a,b)=>a.contract-b.contract||b.rating-a.rating),payroll=roster.reduce((n,p)=>n+p.salary,0);return `<div class="grid"><section class="card"><div class="section-head"><h2>Контракты и зарплаты</h2><span class="pill">${roster.filter(p=>p.contract<=1).length} истекают скоро</span></div><div class="stats"><div class="stat"><span>Зарплатный фонд</span><strong>${money(payroll)}</strong></div><div class="stat"><span>Доступный бюджет</span><strong>${money(S.budget)}</strong></div><div class="stat"><span>Игроков</span><strong>${roster.length}</strong></div><div class="stat"><span>Свободные агенты</span><strong>${S.players.filter(p=>p.club==="FA").length}</strong></div></div><p class="muted" style="margin-top:12px">Продление стоит бонус в размере 10% игровой стоимости игрока. Чем выше рейтинг и потенциал, тем дороже удержать хоккеиста.</p><div class="table-wrap"><table><thead><tr><th>Игрок</th><th>Поз.</th><th>Возраст</th><th>Рейтинг</th><th>Зарплата/год</th><th>Контракт</th><th>Действие</th></tr></thead><tbody>${roster.map(p=>`<tr><td><b>${esc(p.first)} ${esc(p.last)}</b></td><td>${p.pos}</td><td>${p.age}</td><td>${badgeRating(p.rating)}</td><td>${money(p.salary)}</td><td>${p.contract} сез.</td><td><button class="small" onclick="renewContract(${p.id})">Продлить</button></td></tr>`).join("")}</tbody></table></div><div class="actions"><button class="secondary" onclick="startNewSeason()" ${S.phase!=="offseason"?"disabled":""}>Начать новый сезон</button></div>${S.phase!=="offseason"?`<p class="subline">Новый сезон станет доступен после завершения плей-офф.</p>`:""}</section></div>`}
function renewContract(id){const p=S.players.find(x=>x.id===id&&x.club===S.club);if(!p)return;const cost=Math.round(playerValue(p)*.1);if(S.budget<cost){notify("Недостаточно бюджета для продления");return}p.contract=Math.max(2,p.contract)+2;S.budget-=cost;addNews("Продление контракта",`${p.first} ${p.last} продлил контракт ещё на 2 сезона.`);persist();render();notify("Контракт продлён")}
function startNewSeason(){if(S.phase!=="offseason"){notify("Сначала заверши плей-офф");return}S.season++;S.round=0;S.week=1;S.phase="regular";S.results=[];S.playoffResults=[];S.prospects=makeProspects(S.season);S.players.forEach(p=>{p.goals=0;p.assists=0;p.points=0;p.gp=0;p.plusMinus=0;if(p.age<=24&&p.rating<p.potential&&Math.random()<.55)p.rating=Math.min(p.potential,p.rating+1+Math.floor(Math.random()*2));if(p.age>=30&&Math.random()<.45)p.rating=Math.max(48,p.rating-1);});S.playoff={round:1,series:[],champion:null};S.players.forEach(p=>{if(p.club!=="FA"){p.age++;p.contract=Math.max(0,(p.contract||0)-1);if(p.contract===0){p.club="FA";addNews("Игрок вышел на рынок",`${p.first} ${p.last} стал свободным агентом.`)}if(p.age>35&&Math.random()<.25){p.rating=Math.max(50,p.rating-2)}}else if(Math.random()<.2)p.rating=Math.min(90,p.rating+1)});S.budget+=Math.round(myClub().budget*.1);S.players=S.players.filter(p=>p.club!=="FA"||p.contract===0);while(S.players.filter(p=>p.club==="FA").length<35){const id=Math.max(...S.players.map(p=>p.id))+1,n=NAT[Math.floor(Math.random()*NAT.length)],pos=POS[Math.floor(Math.random()*POS.length)],rating=60+Math.floor(Math.random()*20);S.players.push({id,club:"FA",first:FIRST[Math.floor(Math.random()*FIRST.length)],last:LAST[Math.floor(Math.random()*LAST.length)],pos,age:20+Math.floor(Math.random()*15),nat:n[0],flag:n[1],rating,salary:Math.max(5,Math.round((rating-45)*1.15)),contract:0,potential:Math.min(95,rating+Math.floor(Math.random()*12)),injury:0,role:"Свободный агент"})}addNews("Новый сезон",`Стартовал сезон ${S.season}/${S.season+1}. Проверь рынок и контракты.`);persist();render();notify("Новый сезон начался")}
function playoffsPage(){if(!S.playoff)return `<div class="card"><div class="empty">Плей-офф пока не сформирован.</div></div>`;const series=S.playoff.series||[];return `<div class="grid"><section class="card"><div class="section-head"><h2>Кубок Гагарина</h2><span class="pill">${S.phase==="playoff"?`Раунд ${S.playoff.round} из 4`:S.phase==="offseason"?"Сезон завершён":"Регулярный чемпионат"}</span></div>${S.playoff.champion?`<div class="notice"><strong>🏆 Обладатель Кубка Гагарина: ${esc(clubBy(S.playoff.champion)?.name||S.playoff.champion)}</strong></div>`:`<p class="muted">Серия идёт до четырёх побед. Кнопка симуляции проводит игровой день по всем активным сериям.</p>`}<div class="actions"><button onclick="simulateNext()" ${S.phase!=="playoff"?"disabled":""}>▶ Симулировать игровой день</button><button class="secondary" onclick="simulateToNext()" ${S.phase!=="playoff"?"disabled":""}>Симулировать 5 дней</button></div><div class="conference-title">Серии</div>${series.map(s=>`<div class="notice"><strong>${esc(clubBy(s.a)?.name||s.a)} — ${esc(clubBy(s.b)?.name||s.b)}</strong><div class="subline">Раунд ${s.round} · ${s.wa}:${s.wb}${s.done?` · Победитель: ${esc(clubBy(s.winner)?.name||s.winner)}`:" · серия продолжается"}</div></div>`).join("")||`<div class="empty">Сначала сыграй 68 туров регулярного чемпионата.</div>`}</section><section class="card"><h2>Результаты плей-офф</h2>${S.playoffResults?.slice().reverse().map(g=>`<div class="notice">${esc(clubBy(g.home)?.name||g.home)} — ${esc(clubBy(g.away)?.name||g.away)} <strong>${g.hg}:${g.ag}</strong><time>Раунд ${g.round}</time></div>`).join("")||`<div class="empty">Матчей плей-офф ещё нет.</div>`}</section></div>`}
function tradesPage(){const own=myPlayers().slice().sort((a,b)=>b.rating-a.rating);return `<div class="grid"><section class="card"><div class="section-head"><h2>Обмены</h2><span class="pill">Дедлайн — игровое событие</span></div><p class="muted">Выбери игрока своего клуба, затем предложи обмен на игрока другого клуба или денежную компенсацию. ИИ оценивает рейтинг, возраст и стоимость. Предложения могут быть отклонены.</p><h3>Предложить обмен</h3><div class="filters"><select id="tradeOwn" class="field">${own.map(p=>`<option value="${p.id}">${esc(p.last)} (${p.pos}, ${p.rating}) — ${money(playerValue(p))}</option>`).join("")}</select><select id="tradeClub" class="field" onchange="fillTradeTargets()">${CLUBS.filter(c=>c.id!==S.club).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select><select id="tradeTarget" class="field"></select></div><div class="actions"><button onclick="proposeTrade('player')">Предложить игрока на игрока</button><button class="secondary" onclick="proposeTrade('cash')">Продать за деньги</button></div><div class="notice" style="margin-top:12px">Денежные компенсации ограничены доступным бюджетом покупателя. Ограничений по количеству легионеров нет. Белорусы и казахстанцы не считаются легионерами.</div></section><section class="card"><div class="section-head"><h2>Входящие предложения</h2><span class="pill">${S.offers.filter(o=>o.status==="pending").length} активных</span></div>${S.offers.filter(o=>o.status==="pending").map(o=>{const from=clubBy(o.from),p=S.players.find(x=>x.id===o.playerId);return `<div class="notice"><strong>${esc(from.name)}</strong> предлагает ${p?`${esc(p.first)} ${esc(p.last)} (${p.rating})`:"денежную компенсацию"} за твоего игрока.<div class="actions"><button class="small" onclick="respondOffer(${o.id},true)">Принять</button><button class="secondary small" onclick="respondOffer(${o.id},false)">Отклонить</button></div></div>`}).join("")||`<div class="empty">Пока нет предложений. Они могут появиться после симуляции нескольких недель.</div>`}</section><section class="card"><h2>История переговоров</h2>${S.offers.filter(o=>o.status!=="pending").map(o=>`<div class="notice">${esc(o.note||"Предложение закрыто")}<time>${o.status==="accepted"?"Принято":"Отклонено"}</time></div>`).join("")||`<div class="empty">Завершённых сделок пока нет.</div>`}</section></div>`}
function fillTradeTargets(){const club=document.getElementById("tradeClub")?.value;if(!club)return;const target=document.getElementById("tradeTarget");target.innerHTML=S.players.filter(p=>p.club===club).sort((a,b)=>b.rating-a.rating).map(p=>`<option value="${p.id}">${esc(p.last)} (${p.pos}, ${p.rating}) — ${money(playerValue(p))}</option>`).join("")}
function proposeTrade(type){const ownId=Number(document.getElementById("tradeOwn")?.value),targetClub=document.getElementById("tradeClub")?.value,own=S.players.find(p=>p.id===ownId);if(!own||!targetClub)return;let target=null;if(type==="player")target=S.players.find(p=>p.id===Number(document.getElementById("tradeTarget")?.value));if(type==="cash"){const cash=playerValue(own);if(S.budget<0){notify("Недостаточно средств");return}const team=clubBy(targetClub);const likely=Math.random()<.45+(team.strength<own.rating?.12:0);if(likely&&cash<team.budget*.15){S.players=S.players.filter(p=>p.id!==own.id);own.club=targetClub;S.players.push(own);S.budget+=cash;addNews("Состоялся обмен",`${own.first} ${own.last} перешёл в ${team.name} за ${money(cash)}.`);notify("Обмен завершён")}else notify("Клуб отклонил предложение");render();return}if(!target)return;const ownVal=playerValue(own),tarVal=playerValue(target);const fair=ownVal*.72;const accepted=tarVal<=fair||Math.random()<Math.max(.12,Math.min(.75,.55+(ownVal-tarVal)/Math.max(1,ownVal)));if(accepted){own.club=targetClub;target.club=S.club;addNews("Состоялся обмен",`${own.first} ${own.last} перешёл в ${clubBy(targetClub).name}, ${target.first} ${target.last} — в ${myClub().name}.`);S.offers.unshift({id:Date.now(),from:targetClub,status:"accepted",note:`Обмен: ${own.last} ↔ ${target.last}`});notify("Обмен принят!")}else{S.offers.unshift({id:Date.now(),from:targetClub,status:"rejected",note:`${clubBy(targetClub).name} отклонил предложение за ${target.last}`});notify("Клуб отклонил предложение")}render()}
function respondOffer(id,accept){const o=S.offers.find(x=>x.id===id);if(!o)return;o.status=accept?"accepted":"rejected";o.note=accept?"Предложение принято":"Предложение отклонено";render();notify(accept?"Предложение принято":"Предложение отклонено")}
function offerPlayer(id){const p=S.players.find(x=>x.id===id);if(!p)return;openModal(`<h2>Предложить обмен</h2><p>${esc(p.first)} ${esc(p.last)} · ${p.pos} · рейтинг ${p.rating} · стоимость ${money(playerValue(p))}</p><label>Клуб-партнёр</label><select id="modalTradeClub" class="field">${CLUBS.filter(c=>c.id!==S.club).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select><label>Формат</label><select id="modalTradeMode" class="field"><option value="player">Игрок на игрока</option><option value="cash">Продажа за деньги</option></select><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button onclick="modalTrade(${p.id})">Отправить предложение</button></div>`)}
function modalTrade(id){const c=document.getElementById("modalTradeClub").value,mode=document.getElementById("modalTradeMode").value;closeModal();if(mode==="cash"){const p=S.players.find(x=>x.id===id),cash=playerValue(p);if(Math.random()<.5){p.club=c;S.budget+=cash;addNews("Обмен",`${p.last} продан в ${clubBy(c).name} за ${money(cash)}.`);notify("Сделка состоялась")}else notify("Клуб отклонил предложение")}else{const target=S.players.filter(p=>p.club===c).sort((a,b)=>Math.abs(playerValue(a)-playerValue(S.players.find(x=>x.id===id)))-Math.abs(playerValue(b)-playerValue(S.players.find(x=>x.id===id))))[0];if(!target){notify("У клуба нет доступных игроков");return}const own=S.players.find(x=>x.id===id);if(Math.random()<.55){own.club=c;target.club=S.club;addNews("Обмен",`${own.last} обменян на ${target.last} из клуба ${clubBy(c).name}.`);notify("Обмен состоялся")}else notify("Клуб отклонил предложение")}persist();render()}
function openModal(html){document.getElementById("modalRoot").innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function resetSave(){if(!confirm("Удалить сохранённую карьеру и начать заново?"))return;localStorage.removeItem("khlManagerV3");S=defaultState();activeTab="Главная";render();notify("Сохранение сброшено")}
function exportSave(){const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="khl-manager-save.json";a.click();URL.revokeObjectURL(a.href)}
function importSave(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";inp.onchange=async()=>{try{const f=inp.files[0];if(!f)return;const data=JSON.parse(await f.text());if(!data.players||!data.version)throw Error("invalid");S=data;persist();render();notify("Сохранение импортировано")}catch(e){notify("Не удалось импортировать сохранение")}};inp.click()}
if(S.club&&!clubBy(S.club))S.club=null;
if(S.club){if(typeof S.round!=="number")S.round=Math.min(68,myResults().length);if(!Array.isArray(S.playoffResults))S.playoffResults=[];if(!S.playoff)S.playoff={round:1,series:[],champion:null};ensureClubData()}
render();
</script>
</body>
